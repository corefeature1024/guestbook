# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - app-gbcontainer-11

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: crong11.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D52C35281DE04200BF43EE6A6D8CB529 }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_4808BD2859EC4B9B9D5EA3D29524ED99 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: crong11.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D52C35281DE04200BF43EE6A6D8CB529 }}/guestbook-app:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    
    needs: build
    
    steps:
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'app-gbcontainer-11'
          slot-name: 'staging'
          images: 'crong11.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_D52C35281DE04200BF43EE6A6D8CB529 }}/guestbook-app:${{ github.sha }}'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_7ACBAF8B0AD94810A79BB1ECE4339FA0 }}